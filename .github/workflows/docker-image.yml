name: Build Docker Image
on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  push:
    name: Build Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: package-version
        run: |
          echo "version=$(cat package.json | jq -r '.version')" >> $GITHUB_OUTPUT

      - name: lowercase github.repository
        id: lower-repo
        run: |
          echo "repository=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

      - name: Check if package.json version changed
        uses: actions/checkout@v4
        id: check_version
        run: |
          OLD_VERSION=$(git show HEAD~1:package.json | jq -r '.version')
          NEW_VERSION=$(jq -r '.version' package.json)

          echo "Old/new version: $OLD_VERSION / $NEW_VERSION"

          if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
            echo "No version change detected. Skipping build."
            echo "SHOULD_BUILD=false" >> $GITHUB_ENV
          else
            echo "Version changed! Proceeding with build."
            echo "SHOULD_BUILD=true" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{steps.lower-repo.outputs.repository}}:${{steps.package-version.outputs.version}}
            ghcr.io/${{steps.lower-repo.outputs.repository}}:latest
